services:
  inventory-postgres:
    image: postgres:17-alpine
    container_name: korp-inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  billing-postgres:
    image: postgres:17-alpine
    container_name: korp-billing-postgres
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data

volumes:
  inventory-postgres-data:
  billing-postgres-data:
